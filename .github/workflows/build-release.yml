name: Build TT-Vapor-API and Upload to Release
run-name: Build docker image & export tar to Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 创建Release、上传附件必须权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image by docker compose
        run: docker compose build

      - name: Retag image with version tag
        run: |
          # 原compose构建出来的镜像是 tt-vapor-api:latest
          docker tag tt-vapor-api:latest tt-vapor-api:${{ github.ref_name }}

      - name: Export image to tar package
        run: |
          docker save tt-vapor-api:${{ github.ref_name }} -o tt-vapor-api-${{ github.ref_name }}.tar
          # 打包docker-compose.yml一起作为发布附件
          zip tt-vapor-api-compose-${{ github.ref_name }}.zip docker-compose.yml

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## TT-Vapor-API Release ${{ github.ref_name }}
            - Image tar包：`tt-vapor-api-${{ github.ref_name }}.tar`
              使用方式：`docker load -i tt-vapor-api-${{ github.ref_name }}.tar`
            - compose压缩包：包含docker-compose.yml
          files: |
            tt-vapor-api-${{ github.ref_name }}.tar
            tt-vapor-api-compose-${{ github.ref_name }}.zip
