name: Start Codespace with Listing

on:
  workflow_dispatch:
    inputs:
      codespace_name:
        description: '留空则自动启动第一个已停止的实例；也可手动输入确切名称'
        required: false
        default: ''
        type: string

jobs:
  manage-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: List and Start Codespace
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
        run: |
          echo "=================== 当前账号下的所有 Codespace ==================="
          # 1. 打印格式化列表（名称、仓库、状态、分支）
          gh codespace list
          echo "=================================================================="

          TARGET="${{ inputs.codespace_name }}"

          # 2. 如果用户没有手动输入名称，自动挑选第一个处于 Shutdown/停止状态的 Codespace
          if [ -z "$TARGET" ]; then
            echo "未指定 codespace_name，正在查找可启动的实例..."
            TARGET=$(gh api user/codespaces --jq '.codespaces[] | select(.state=="Shutdown") | .name' | head -n 1)

            if [ -z "$TARGET" ]; then
              echo "没有找到处于停止状态的 Codespace。正在检查是否有已在运行的实例..."
              RUNNING_CS=$(gh api user/codespaces --jq '.codespaces[] | select(.state=="Available") | .name' | head -n 1)
              if [ -n "$RUNNING_CS" ]; then
                echo "已有运行中的实例: $RUNNING_CS，无需重复启动。"
                exit 0
              fi
              echo "::error::当前账号下没有任何可用的 Codespace。"
              exit 1
            fi
            echo "自动选定实例: $TARGET"
          fi

          # 3. 启动目标 Codespace
          echo "正在启动: $TARGET ..."
          CURRENT_STATE=$(gh api "user/codespaces/$TARGET" --jq '.state' 2>/dev/null || echo "NOT_FOUND")

          if [ "$CURRENT_STATE" = "NOT_FOUND" ]; then
            echo "::error::未找到指定的 Codespace: $TARGET"
            exit 1
          fi

          if [ "$CURRENT_STATE" = "Available" ]; then
            echo "该 Codespace 已经处于就绪状态！"
            exit 0
          fi

          gh api -X POST "user/codespaces/$TARGET/start" > /dev/null

          # 4. 轮询等待就绪
          echo "等待启动中..."
          for i in {1..30}; do
            STATE=$(gh api "user/codespaces/$TARGET" --jq '.state')
            echo "[$i/30] 状态: $STATE"
            if [ "$STATE" = "Available" ]; then
              echo " Codespace 启动成功！"
              WEB_URL=$(gh api "user/codespaces/$TARGET" --jq '.web_url')
              echo "访问地址: $WEB_URL"
              exit 0
            fi
            sleep 5
          done

          echo "::warning::启动超时，当前状态: $STATE"
